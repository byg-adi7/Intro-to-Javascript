<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM projects 
  </title>
  <style>
    body{
      font-family: Arial;
    }
    .subscribe-button{
      background-color: black;
      color: white;
      border:none;
      padding-top:  10px;
      padding-bottom: 10px;
      padding-right: 15px;
      padding-left: 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 40px;
      margin-left: 34px;
      margin-top: 15px;
      
      
    }
    .subscribed-button{
      background-color: antiquewhite;
      color: black;
    }
    .input{
      font-size: 15px;
      padding-left: 8px;
      padding-top: 7px;
      padding-bottom: 7px;
      border-radius: 7px;
      border-width: 1px;
    }
    .cal-button{
      font-weight: bold;
      padding: 9px 15px;
      background-color: brown;
      color: beige;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 15px;
      
    }
    .cost-p{
      margin-bottom: 20px;
    }
    
    
  </style>
</head>
<body>
  <p>YouTube Subscribe Button</p>
      <button class = "js-subscribe-button subscribe-button"
      
        onclick="
        clickedsub_btn();
        ">
          Subscribe
      </button>
        <p> Amazon Shipping Calculator</p>
        <input 
        type="number" 
        placeholder="Cost of order"
        class="input-space input"
        onkeydown="
        handleventkeydown(event);
        ">
        <button
        class="js-cal-button cal-button"
            onclick = "
            calculate();">
              Calculate
        </button>
        <p class="totalcost cost-p"></p>
        <p class = "rps-header">Rock Paper Scissors</p>
        <p class="link">This is the link to the <a href="improved_rps.html">rock paper scissors game</a>. Try it out</p>
        








  <script>
    function handleventkeydown(event){
      if(event.key === 'Enter'){
        calculate();
       }
    }

    function clickedsub_btn(){
      const subelement = document.querySelector('.js-subscribe-button')
      if(subelement.innerText ==='Subscribe'){
        subelement.innerHTML ='Subscribed'
        subelement.classList.add('subscribed-button')
      }else{
        subelement.innerHTML = 'Subscribe'
        subelement.classList.remove('subscribed-button');
      }
    }
    function calculate(){
      const num = document.querySelector('.input-space');
      let cost = Number(num.value);
      if(cost <40){
        cost+=10;
        cost = Number(cost.toFixed(2))
      }
      document.querySelector('.totalcost').innerHTML=`$${cost}`
    }
  </script>
</body>
</html>
