<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM projects 
  </title>
</head>
<body>
  <p>YouTube Subscribe Button</p>
  <button class = "js-subscribe-button"
  onclick="
  clickedsub_btn();
  ">
    Subscribe
  </button>

  <p>Rock Paper Scissors</p>
  <i>Click here</i>
  <script>
    function clickedsub_btn(){
      const subelement = document.querySelector('.js-subscribe-button')
      if(subelement.innerText ==='Subscribe'){
        subelement.innerHTML ='Subscribed'
      }else{
        subelement.innerHTML = 'Subscribe'
      }
    }

  </script>
</body>
</html>
