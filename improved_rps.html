<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>functions-improved rock-paper scissors game</title>
</head>
<body>
 <p>Rock Paper Scissors</p>
 <button
  onclick="
  playerchoice='Rock'; 
   choice = computerchoice();
  alert(`You chose ${playerchoice} and the computer chose ${choice}.
  Result: ${computewinner(playerchoice,choice)},
   Ties: ${scores.ties},
    Player Wins: ${scores.playerWins},
     Computer Wins: ${scores.computerWins}`);
  "
  >Rock</button>
  <button
   onclick="
  playerchoice='Paper'; 
   choice = computerchoice();
  alert(`You chose ${playerchoice} and the computer chose ${choice}.
  Result: ${computewinner(playerchoice,choice)},
   Ties: ${scores.ties},
    Player Wins: ${scores.playerWins},
     Computer Wins: ${scores.computerWins}`);
  ">Paper</button>
  <button
  onclick="
  
  playerchoice='Scissors'; 
  choice = computerchoice();
  alert(`You chose ${playerchoice} and the computer chose ${choice}.
  Result: ${computewinner(playerchoice,choice)},
   Ties: ${scores.ties},
    Player Wins: ${scores.playerWins},
     Computer Wins: ${scores.computerWins}`);
  ">Scissors</button>
  <button onclick="scores.numberOfGames = 0; scores.playerWins = 0; scores.computerWins = 0; scores.ties = 0;
  alert('Scores have been reset.');">
    Reset score
  </button>


  
</body>
<script>
  
const scores={
 numberOfGames: 0,
   playerWins: 0,
   computerWins: 0,
  ties: 0
}

  let playerchoice;
  let choice;
  function computerchoice(){
    const choices  = ["Rock", "Paper", "Scissors"];
    const randoomIndex = Math.floor(Math.random()*3);
    
    return choices[randoomIndex];
    
  }

  function computewinner(playerchoice,choice){
  scores.numberOfGames++;

    if(playerchoice===choice){
      scores.ties++;
      return "It's a tie!";

    } else if(
      (playerchoice==="Rock" && choice==="Scissors") ||
      (playerchoice==="Paper" && choice==="Rock") ||
      (playerchoice==="Scissors" && choice ==="Paper")
    ){
      scores.playerWins++;
      return "You win!";
    } else {
      scores.computerWins++;
      return "Computer wins!";
    }
   
  }
 
   
  
</script>
</html>
