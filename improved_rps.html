<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>functions-improved rock-paper scissors game</title>
  <style>
    body{
            background-color: black;
      color: white;
      margin-left: 15px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .header{
      margin-top: 0px ;
      margin-left: 0px;
      margin-right: 0px;
      border-radius: 10px;
      padding-left: 250px;
      background-color: rgb(121, 145, 178);
      font-weight: 100px;
      padding-bottom: 1px;
      padding-top: 10px;
      font-size: 50px;
      border-spacing: 1px;
    }
    .player-notice{
      margin-left: 590px;
      font-size: 30px;
      margin-bottom: 0px;
      
    }
    .rock-btn{
      margin: 60px;
        margin-left: 250px;
        margin-top: 10px;
        margin-bottom: 0px;
        border: none;
        background-color: blue;
        cursor: pointer;

      padding: 30px;
      border-radius: 1000px;
      font-size: 100px;

    }
    .paper-btn{
       margin: 60px;
     margin-top: 10px;
     margin-bottom: 0px;
     background-color: red;
     border: none;
      padding: 30px;
      border-radius: 1000px;
      font-size: 100px;
      cursor: pointer;
    }
    .scissors-btn{
        margin: 60px;
        margin-top: 10px;
        margin-bottom: 0px;
        background-color: gray;
      padding: 30px;
      border: none;
      border-radius: 1000px;
      font-size: 100px;
      cursor: pointer;
    }
     .comp-notice{
      margin-top: 10ox;
      margin-left: 590px;
      font-size: 30px;
      margin-bottom: 0px;
      
    }
      .compchoice{
        margin: 60px;
        margin-top: 10px;
         margin-left: 595px;
         border: none;
      padding: 30px;
      border-radius: 1000px;
      margin-bottom: 0px;
      font-size: 100px;
    }
    .comppaper{
      background-color: red;
    }
    .comprock{
      background-color: blue;
    }
    .compsciss{
      background-color: gray;
    }
    .winner{
       margin-left: 600px;
       margin-right: 500px;
      font-size: 30px;
      margin-bottom: 0px;

    }
    .reset-btn{
        margin-left: 610px;
       margin-right: 550px;
       padding: 20px 30px;
       font-weight: bold;
       font-size: large;
       color: white;
       background-color: red;
       border: none;
       cursor: pointer;
       border-radius: 25px;

    }
  </style>
</head>
<body>
<div class="header"><h1 class="header">Rock Paper Scissors</h1></div>
<p class ="player-notice">Player choose</p>
      <button
      class="rock-btn"
        onclick="
        playerchoice='Rock'; 
        choice = computerchoice();
        displaycompchoice(choice);
      result= computewinner(playerchoice,choice);
        "
        >✊
      </button>
        <button
        class="paper-btn"
        onclick="
        playerchoice='Paper'; 
        choice = computerchoice();
        displaycompchoice(choice);
        result= computewinner(playerchoice,choice);
        ">🖐️
      </button>
      <button
      class="scissors-btn"
        onclick="
        
        playerchoice='Scissors'; 
        choice = computerchoice();
        displaycompchoice(choice);
         result= computewinner(playerchoice,choice);
       
        ">✌️
      </button>
      <p class="comp-notice">Computer chose</p>
      <button class="js-compchoice compchoice">
        🤖
      </button>
       <p class="displaywinner winner"></p>
        <p class="displayscores"></p>
        <button class="reset-btn" 
        onclick=
          "scores.numberOfGames = 0; 
          scores.playerWins = 0; 
          scores.computerWins = 0; 
          scores.ties = 0;
            document.querySelector('.displaywinner').innerText = 
            'Scores have been reset. You can start the game now';
            update();
             localStorage.removeItem('scores');
             localStorage.setItem('scores',JSON.stringify(scores));
 
        ">
            Reset score
        </button>
       
        


<script>
  let result;
 
  
    const scores=JSON.parse(localStorage.getItem('scores'))
    ||{
    numberOfGames: 0,
      playerWins: 0,
      computerWins: 0,
      ties: 0
    }
    update();
    

    
      function computerchoice(){
        const choices  = ["Rock", "Paper", "Scissors"];
        const randoomIndex = Math.floor(Math.random()*3);
        
        return choices[randoomIndex];
        
      }
      function displaycompchoice(choice){
        let emoji = ['✊','🖐️','✌️'];
        let index;
          let comp =document.querySelector('.js-compchoice');
       
      
        if(choice ==='Rock'){
          index = 0;
          comp.classList.remove('compsciss','comppaper')
          comp.classList.add('comprock');

        }
        else if(choice ==='Paper'){
          index = 1;
          comp.classList.remove('comprock','compsciss')
          comp.classList.add('comppaper')
        }
        else{
          index = 2;
          comp.classList.remove('comprock','comppaper')
          comp.classList.add('compsciss')
        }
      
        comp.innerHTML = emoji[index];
      }

      function update(){
        document.querySelector('.displayscores').innerText = 
        `Number of games = ${scores.numberOfGames}
        Player wins = ${scores.playerWins}
        Computer wins = ${scores.computerWins}
        Ties = ${scores.ties}` ;

      }
      
      function computewinner(playerchoice,choice){
      scores.numberOfGames++;
      let results;

        if(playerchoice===choice){
          scores.ties++;
          results =  "It's a tie!";

        } else if(
          (playerchoice==="Rock" && choice==="Scissors") ||
          (playerchoice==="Paper" && choice==="Rock") ||
          (playerchoice==="Scissors" && choice ==="Paper")
        ){
          scores.playerWins++;
          results =  "You win!";
        } else {
          scores.computerWins++;
          results =  "Computer wins!";
        }
        document.querySelector('.displaywinner').innerText = `${results}`;
        update();
        localStorage.setItem('scores',JSON.stringify(scores));
      return results;
      }
    
      
     
</script>
</body>

</html>
